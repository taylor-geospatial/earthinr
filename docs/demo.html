<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live WebGPU Demo — EarthINR</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='5' y='1' width='6' height='14' fill='%231d4ed8'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%231d4ed8'/%3E%3Crect x='2' y='5' width='12' height='6' fill='%231d4ed8'/%3E%3Crect x='4' y='4' width='3' height='4' fill='%234ade80'/%3E%3Crect x='9' y='4' width='3' height='6' fill='%234ade80'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/deck.gl@9.1.4/dist.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    /* Default: Dark Digital CRT / Cartography Theme (matches docs/index.html) */
    :root {
      --bg: #0d1117;
      --surface: #131922;
      --surface-alt: #18202c;
      --surface-hover: #1d2736;
      --border: #273244;
      --border-strong: #394963;
      --shadow-color: #05080d;
      --shadow-btn: 3px 3px 0 var(--shadow-color);
      --shadow-btn-active: 1px 1px 0 var(--shadow-color);

      --text: #e6edf3;
      --text-muted: #8b9bb4;
      --text-faint: #5f708a;

      --mint: #4ade80;
      --cyan: #38bdf8;
      --amber: #facc15;
      --violet: #a78bfa;
      --danger: #f87171;

      --map-bg: #080c12;
      --readout-bg: rgba(13, 17, 23, 0.92);
      --readout-text: #e6edf3;
      --readout-border: #38bdf8;

      --btn-primary-bg: var(--mint);
      --btn-primary-fg: #08120c;
      --btn-primary-bd: #22c55e;

      --badge-webgpu-bg: rgba(74, 222, 128, 0.16);
      --badge-webgpu-bd: var(--mint);
      --badge-webgpu-fg: var(--mint);

      --badge-wasm-bg: rgba(56, 189, 248, 0.14);
      --badge-wasm-bd: var(--cyan);
      --badge-wasm-fg: var(--cyan);

      --badge-err-bg: rgba(248, 113, 113, 0.16);
      --badge-err-bd: var(--danger);
      --badge-err-fg: #fecaca;

      --font-pixel: "Silkscreen", ui-monospace, monospace;
      --font-mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Light Mode: Retro-LCD / Drafting Paper */
    :root[data-theme="light"] {
      --bg: #f2f4ef;
      --surface: #fafbf8;
      --surface-alt: #e8ece3;
      --surface-hover: #edf1e8;
      --border: #2d3a4b;
      --border-strong: #1c2430;
      --shadow-color: rgba(28, 36, 48, 0.28);
      --shadow-btn: 3px 3px 0 var(--shadow-color);
      --shadow-btn-active: 1px 1px 0 var(--shadow-color);

      --text: #1c2430;
      --text-muted: #4a596c;
      --text-faint: #6f7f93;

      --mint: #15803d;
      --cyan: #0369a1;
      --amber: #b45309;
      --violet: #6d28d9;
      --danger: #b91c1c;

      --map-bg: #121a24;
      --readout-bg: rgba(250, 251, 248, 0.94);
      --readout-text: #1c2430;
      --readout-border: #2d3a4b;

      --btn-primary-bg: #1c2430;
      --btn-primary-fg: #fafbf8;
      --btn-primary-bd: #1c2430;

      --badge-webgpu-bg: rgba(21, 128, 61, 0.14);
      --badge-webgpu-bd: #15803d;
      --badge-webgpu-fg: #14532d;

      --badge-wasm-bg: rgba(3, 105, 161, 0.12);
      --badge-wasm-bd: #0369a1;
      --badge-wasm-fg: #0c4a6e;

      --badge-err-bg: #fee2e2;
      --badge-err-bd: #b91c1c;
      --badge-err-fg: #7f1d1d;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      border-radius: 0;
    }

    [hidden] {
      display: none !important;
    }

    html {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    @media (min-width: 721px) {
      body {
        height: 100dvh;
        overflow: hidden;
      }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Top header + nav (matches docs/index.html) */
    .topbar {
      flex-shrink: 0;
      position: relative;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 20px;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
    }

    .topbar-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
    }

    .topbar-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
    }

    .pixel-globe {
      display: block;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      image-rendering: pixelated;
    }

    .brand-wordmark {
      font-family: var(--font-pixel);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    .brand-divider {
      color: var(--text-faint);
      user-select: none;
    }

    .demo-title {
      margin: 0;
      font-family: var(--font-pixel);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--cyan);
    }

    .demo-subtitle {
      margin: 0;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .topbar-nav a {
      font-family: var(--font-pixel);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 4px 2px;
      border-bottom: 2px solid transparent;
      transition: color 0.12s ease, border-color 0.12s ease;
    }

    .topbar-nav a:hover {
      color: var(--text);
    }

    .topbar-nav a.active {
      color: var(--cyan);
      border-bottom-color: var(--cyan);
    }

    /* Controls bar (pinned above map stage so it never shrinks or gets occluded) */
    .controls-bar {
      flex-shrink: 0;
      position: relative;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 18px;
      padding: 10px 24px;
      background: var(--surface-alt);
      border-bottom: 2px solid var(--border);
    }

    .controls-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
    }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .field label {
      font-family: var(--font-pixel);
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .field select {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text);
      background: var(--surface);
      border: 2px solid var(--border-strong);
      padding: 5px 9px;
      outline: none;
      cursor: pointer;
      min-width: 0;
      max-width: 100%;
    }
    .field select:focus {
      border-color: var(--cyan);
    }

    .checkbox-field {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-field input[type="checkbox"] {
      accent-color: var(--cyan);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .px-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      background: var(--surface);
      border: 2px solid var(--border-strong);
      padding: 5px 12px;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: background 0.1s ease, border-color 0.1s ease, color 0.1s ease, transform 0.08s ease, box-shadow 0.08s ease;
      user-select: none;
    }
    .px-btn:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--cyan);
    }
    .px-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: var(--shadow-btn-active);
    }
    .px-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .px-btn-primary {
      background: var(--btn-primary-bg);
      border-color: var(--btn-primary-bd);
      color: var(--btn-primary-fg);
    }
    .px-btn-primary:hover:not(:disabled) {
      background: var(--cyan);
      border-color: var(--cyan);
      color: #06131c;
    }

    .px-btn-sm {
      padding: 4px 10px;
      font-size: 11px;
    }

    /* Telemetry / status strip */
    .telemetry {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      min-width: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
    }

    .badge-webgpu {
      font-family: var(--font-pixel);
      font-size: 10px;
      background: var(--badge-webgpu-bg);
      border-color: var(--badge-webgpu-bd);
      color: var(--badge-webgpu-fg);
    }

    .badge-wasm {
      font-family: var(--font-pixel);
      font-size: 10px;
      background: var(--badge-wasm-bg);
      border-color: var(--badge-wasm-bd);
      color: var(--badge-wasm-fg);
    }

    .badge-error {
      font-family: var(--font-pixel);
      font-size: 10px;
      background: var(--badge-err-bg);
      border-color: var(--badge-err-bd);
      color: var(--badge-err-fg);
    }

    .status-line {
      color: var(--text-muted);
      font-size: 11.5px;
    }

    /* Map container (isolated stacking context below topbar/controls) */
    .map-stage {
      position: relative;
      z-index: 1;
      isolation: isolate;
      flex: 1 1 auto;
      min-height: 420px;
      width: 100%;
      background: var(--map-bg);
      overflow: hidden;
    }

    #deck-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hover-readout {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      padding: 7px 12px;
      border: 2px solid var(--readout-border);
      background: var(--readout-bg);
      color: var(--readout-text);
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45);
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      max-width: calc(100% - 32px);
    }

    .hover-readout .label {
      font-family: var(--font-pixel);
      font-size: 9.5px;
      color: var(--cyan);
      margin-right: 6px;
    }

    .hover-readout .sep {
      color: var(--text-faint);
      margin: 0 8px;
    }

    .readout-item {
      display: inline-block;
      white-space: nowrap;
    }

    .error-overlay {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      max-width: 560px;
      width: calc(100% - 32px);
      padding: 11px 14px;
      border: 2px solid var(--danger);
      background: var(--surface);
      color: var(--text);
      box-shadow: 3px 3px 0 var(--shadow-color);
      font-size: 12.5px;
      display: none;
    }
    .error-overlay.show { display: block; }
    .error-overlay strong { color: var(--danger); }

    @media (max-width: 720px) {
      .topbar {
        padding: 10px 12px;
        gap: 8px 12px;
      }
      .demo-subtitle,
      .brand-divider,
      .demo-title {
        display: none;
      }
      .topbar-right {
        gap: 10px;
      }
      .topbar-nav {
        gap: 12px;
      }
      .controls-bar {
        padding: 10px 12px;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .controls-group {
        width: 100%;
        gap: 8px 10px;
      }
      .field {
        flex: 1 1 auto;
      }
      .field select {
        flex: 1 1 auto;
        width: 100%;
      }
      .telemetry {
        width: 100%;
        gap: 6px;
        overflow-wrap: anywhere;
      }
      .map-stage {
        flex: 1 0 380px;
        min-height: 380px;
      }
      .hover-readout {
        left: 10px;
        bottom: 10px;
        max-width: calc(100% - 20px);
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="topbar-brand" href="index.html">
        <svg class="pixel-globe" viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true">
          <!-- Pixel-art Earth globe (16x16) -->
          <rect x="5" y="1" width="6" height="1" fill="#38bdf8"/>
          <rect x="3" y="2" width="2" height="1" fill="#38bdf8"/>
          <rect x="11" y="2" width="2" height="1" fill="#38bdf8"/>
          <rect x="2" y="3" width="1" height="2" fill="#38bdf8"/>
          <rect x="13" y="3" width="1" height="2" fill="#38bdf8"/>
          <rect x="1" y="5" width="1" height="6" fill="#38bdf8"/>
          <rect x="14" y="5" width="1" height="6" fill="#38bdf8"/>
          <rect x="2" y="11" width="1" height="2" fill="#38bdf8"/>
          <rect x="13" y="11" width="1" height="2" fill="#38bdf8"/>
          <rect x="3" y="13" width="2" height="1" fill="#38bdf8"/>
          <rect x="11" y="13" width="2" height="1" fill="#38bdf8"/>
          <rect x="5" y="14" width="6" height="1" fill="#38bdf8"/>
          <!-- Ocean fill -->
          <rect x="5" y="2" width="6" height="12" fill="#1d4ed8"/>
          <rect x="3" y="3" width="10" height="10" fill="#1d4ed8"/>
          <rect x="2" y="5" width="12" height="6" fill="#1d4ed8"/>
          <!-- Subtle highlight -->
          <rect x="4" y="3" width="2" height="1" fill="#60a5fa"/>
          <rect x="3" y="4" width="1" height="2" fill="#60a5fa"/>
          <!-- Polar caps -->
          <rect x="6" y="2" width="4" height="1" fill="#e6edf3"/>
          <rect x="6" y="13" width="4" height="1" fill="#e6edf3"/>
          <!-- Americas (left) -->
          <rect x="4" y="4" width="3" height="2" fill="#4ade80"/>
          <rect x="3" y="6" width="3" height="2" fill="#4ade80"/>
          <rect x="5" y="8" width="2" height="2" fill="#22c55e"/>
          <rect x="5" y="10" width="2" height="2" fill="#22c55e"/>
          <!-- Europe / Africa (right) -->
          <rect x="9" y="4" width="3" height="2" fill="#4ade80"/>
          <rect x="8" y="6" width="4" height="2" fill="#4ade80"/>
          <rect x="9" y="8" width="3" height="3" fill="#22c55e"/>
          <rect x="10" y="11" width="2" height="1" fill="#22c55e"/>
        </svg>
        <span class="brand-wordmark">EARTHINR</span>
      </a>
      <span class="brand-divider">/</span>
      <h1 class="demo-title">LIVE EMBEDDING MAP</h1>
      <p class="demo-subtitle">In-browser ONNX inference — global/regional/local PCA, spatial gradients, and click similarity.</p>
    </div>
    <div class="topbar-right">
      <nav class="topbar-nav" aria-label="Primary">
        <a href="index.html">Leaderboard</a>
        <a href="demo.html" class="active" aria-current="page">WebGPU Demo</a>
      </nav>
      <button id="theme-toggle" class="px-btn px-btn-sm" type="button" title="Toggle dark CRT / light LCD mode">
        LCD Light
      </button>
    </div>
  </header>

  <section class="controls-bar" aria-label="Model and grid controls">
    <div class="controls-group">
      <div class="field">
        <label for="model-select">Model</label>
        <select id="model-select">
          <option value="csp-inat">csp-inat (0.8 MB)</option>
          <option value="csp-fmow">csp-fmow (0.8 MB)</option>
          <option value="sinr" selected>sinr (2.1 MB)</option>
          <option value="satclip-vit16-l10">satclip-vit16-l10 (2.1 MB)</option>
          <option value="osmgraphclip-a-l10">osmgraphclip-a-l10 (2.1 MB)</option>
          <option value="le-sinr">le-sinr (2.4 MB)</option>
          <option value="geoclosp-rn">geoclosp-rn (2.6 MB)</option>
          <option value="hydroloc">hydroloc (4.3 MB)</option>
          <option value="satclip-vit16-l40">satclip-vit16-l40 (6.3 MB)</option>
          <option value="tte">tte (13.2 MB)</option>
          <option value="climplicit">climplicit (16.2 MB)</option>
        </select>
      </div>

      <div class="field">
        <label for="grid-select">Grid</label>
        <select id="grid-select">
          <option value="250">250 km</option>
          <option value="100" selected>100 km</option>
          <option value="50">50 km</option>
          <option value="25">25 km</option>
        </select>
      </div>

      <div class="field">
        <label for="view-select">View</label>
        <select id="view-select">
          <option value="pca-1-3" selected>PCA 1–3 (Global)</option>
          <option value="pca-4-6">PCA 4–6 (Regional)</option>
          <option value="pca-7-9">PCA 7–9 (Fine)</option>
          <option value="pca-local">PCA (Viewport Local)</option>
          <option value="gradient">Gradient ‖∇e‖</option>
          <option value="similarity">Click Similarity</option>
        </select>
      </div>

      <button id="refit-btn" class="px-btn px-btn-sm" type="button" hidden title="Refit local PCA to current viewport">
        Refit View
      </button>

      <label class="checkbox-field">
        <input id="coastlines-toggle" type="checkbox" checked />
        Coastlines
      </label>

      <button id="run-btn" class="px-btn px-btn-primary" type="button">Run</button>
    </div>

    <div class="telemetry">
      <span id="backend-badge" class="badge">Backend: --</span>
      <span id="grid-badge" class="badge">Grid: --</span>
      <span id="timing-badge" class="badge">Timing: --</span>
      <span id="status-line" class="status-line">Initializing&hellip;</span>
    </div>
  </section>

  <main class="map-stage">
    <div id="deck-container"></div>
    <div id="error-overlay" class="error-overlay" role="alert"></div>
    <div id="hover-readout" class="hover-readout">
      <span class="readout-item"><span class="label">COORD</span><span id="hover-coord">Move pointer over map</span></span>
      <span class="sep">|</span>
      <span id="hover-metric-wrap" hidden><span class="readout-item"><span class="label" id="hover-metric-label">sim</span><span id="hover-metric-val">--</span></span><span class="sep">|</span></span>
      <span class="readout-item"><span class="label">e[0..2]</span><span id="hover-emb">--</span></span>
    </div>
  </main>

  <script>
    (() => {
      'use strict';

      // Shared theme toggle (default: dark CRT; persisted under coordbench-theme)
      const themeToggle = document.getElementById('theme-toggle');
      function syncThemeButton() {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        if (themeToggle) themeToggle.textContent = isLight ? 'CRT Dark' : 'LCD Light';
      }
      function initTheme() {
        const saved = localStorage.getItem('coordbench-theme');
        document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
        syncThemeButton();
      }
      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          const isLight = document.documentElement.getAttribute('data-theme') === 'light';
          const next = isLight ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('coordbench-theme', next);
          syncThemeButton();
        });
      }
      initTheme();

      const HF_BASE = 'https://huggingface.co/taylor-geospatial/earthinr-zoo/resolve/main';
      const ORT_WASM_CDN = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
      const WORLD_ATLAS_URL = 'https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json';

      const LON_MIN = -180;
      const LON_MAX = 180;
      const LAT_MIN = -85;
      const LAT_MAX = 85;
      const KM_PER_DEG = 111.32;
      const BATCH_SIZE = 4096;
      const LOCAL_PCA_DEBOUNCE_MS = 250;

      function latToMercY(lat) {
        const clamped = Math.max(LAT_MIN, Math.min(LAT_MAX, lat));
        return Math.log(Math.tan(Math.PI / 4 + (clamped * Math.PI) / 360));
      }

      function mercYToLat(my) {
        return (2 * Math.atan(Math.exp(my)) - Math.PI / 2) * (180 / Math.PI);
      }

      const MERC_Y_MIN = latToMercY(LAT_MIN);
      const MERC_Y_MAX = latToMercY(LAT_MAX);

      const INITIAL_VIEW_STATE = {
        longitude: 0,
        latitude: 15,
        zoom: 1.35,
        minZoom: 0.5,
        maxZoom: 10,
        pitch: 0,
        bearing: 0,
      };

      const INFERNO_STOPS = [
        [0.0, [0, 0, 4]],
        [0.125, [31, 12, 72]],
        [0.25, [85, 15, 109]],
        [0.375, [136, 34, 106]],
        [0.5, [186, 54, 85]],
        [0.625, [227, 89, 51]],
        [0.75, [249, 140, 10]],
        [0.875, [249, 201, 50]],
        [1.0, [252, 255, 164]],
      ];

      const VIRIDIS_STOPS = [
        [0.0, [68, 1, 84]],
        [0.125, [72, 36, 117]],
        [0.25, [65, 68, 135]],
        [0.375, [53, 95, 141]],
        [0.5, [42, 120, 142]],
        [0.625, [33, 145, 140]],
        [0.75, [53, 183, 121]],
        [0.875, [144, 215, 67]],
        [1.0, [253, 231, 37]],
      ];

      function buildColormapLut(stops) {
        const lut = new Uint8Array(256 * 3);
        for (let i = 0; i < 256; i++) {
          const t = i / 255;
          let sIdx = 0;
          while (sIdx < stops.length - 2 && t > stops[sIdx + 1][0]) {
            sIdx++;
          }
          const [t0, c0] = stops[sIdx];
          const [t1, c1] = stops[sIdx + 1];
          const alpha = t1 > t0 ? (t - t0) / (t1 - t0) : 0;
          lut[i * 3] = Math.round(c0[0] + (c1[0] - c0[0]) * alpha);
          lut[i * 3 + 1] = Math.round(c0[1] + (c1[1] - c0[1]) * alpha);
          lut[i * 3 + 2] = Math.round(c0[2] + (c1[2] - c0[2]) * alpha);
        }
        return lut;
      }

      const INFERNO_LUT = buildColormapLut(INFERNO_STOPS);
      const VIRIDIS_LUT = buildColormapLut(VIRIDIS_STOPS);

      if (typeof ort !== 'undefined' && ort.env && ort.env.wasm) {
        ort.env.wasm.wasmPaths = ORT_WASM_CDN;
      }

      const modelSelect = document.getElementById('model-select');
      const gridSelect = document.getElementById('grid-select');
      const viewSelect = document.getElementById('view-select');
      const refitBtn = document.getElementById('refit-btn');
      const coastlinesToggle = document.getElementById('coastlines-toggle');
      const runBtn = document.getElementById('run-btn');
      const backendBadge = document.getElementById('backend-badge');
      const gridBadge = document.getElementById('grid-badge');
      const timingBadge = document.getElementById('timing-badge');
      const statusLine = document.getElementById('status-line');
      const errorOverlay = document.getElementById('error-overlay');
      const hoverCoord = document.getElementById('hover-coord');
      const hoverMetricWrap = document.getElementById('hover-metric-wrap');
      const hoverMetricLabel = document.getElementById('hover-metric-label');
      const hoverMetricVal = document.getElementById('hover-metric-val');
      const hoverEmb = document.getElementById('hover-emb');

      const bufferCache = new Map();
      const sessionCache = new Map();

      const state = {
        runId: 0,
        landGeoJson: null,
        bitmapCanvas: null,
        bitmapVersion: 0,
        embeddings: null,
        unitEmbeddings: null,
        embedDim: 0,
        gridW: 0,
        gridH: 0,
        globalPca: null,
        gradientValues: null,
        similarityValues: null,
        currentView: viewSelect ? viewSelect.value : 'pca-1-3',
        simSeed: { lon: -0.1276, lat: 51.5072 }, // London default
        viewState: Object.assign({}, INITIAL_VIEW_STATE),
        refitTimer: null,
        lastHoverCoord: null,
        lastInferMs: 0,
        lastDownloadMs: 0,
        lastModelId: '',
        deckInstance: null,
      };

      function setStatus(text) {
        statusLine.textContent = text;
      }

      function showError(message) {
        if (!message) {
          errorOverlay.classList.remove('show');
          errorOverlay.innerHTML = '';
          return;
        }
        errorOverlay.innerHTML = '<strong>Error:</strong> ' + escapeHtml(message);
        errorOverlay.classList.add('show');
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function setBackendBadge(provider) {
        backendBadge.className = 'badge';
        if (provider === 'webgpu') {
          backendBadge.textContent = 'WEBGPU';
          backendBadge.classList.add('badge-webgpu');
        } else if (provider === 'wasm') {
          backendBadge.textContent = 'WASM';
          backendBadge.classList.add('badge-wasm');
        } else if (provider === 'error') {
          backendBadge.textContent = 'FAILED';
          backendBadge.classList.add('badge-error');
        } else {
          backendBadge.textContent = 'Backend: --';
        }
      }

      function yieldToBrowser() {
        return new Promise((resolve) => setTimeout(resolve, 0));
      }

      function buildCoordGrid(km) {
        const stepDeg = km / KM_PER_DEG;
        const width = Math.max(2, Math.round((LON_MAX - LON_MIN) / stepDeg));
        const height = Math.max(2, Math.round((LAT_MAX - LAT_MIN) / stepDeg));
        const count = width * height;
        const coords = new Float32Array(count * 2);

        let ptr = 0;
        for (let y = 0; y < height; y++) {
          const my = MERC_Y_MAX - ((y + 0.5) / height) * (MERC_Y_MAX - MERC_Y_MIN);
          const lat = mercYToLat(my);
          for (let x = 0; x < width; x++) {
            const lon = LON_MIN + ((x + 0.5) / width) * (LON_MAX - LON_MIN);
            coords[ptr++] = lon;
            coords[ptr++] = lat;
          }
        }
        return { width, height, count, coords };
      }

      async function fetchModelBuffer(modelId) {
        if (bufferCache.has(modelId)) {
          return { buffer: bufferCache.get(modelId), downloadMs: 0 };
        }
        const url = HF_BASE + '/' + encodeURIComponent(modelId) + '/model.onnx';
        const t0 = performance.now();
        const resp = await fetch(url);
        if (!resp.ok) {
          throw new Error('HTTP ' + resp.status + ' fetching ' + modelId + '/model.onnx');
        }
        const buffer = await resp.arrayBuffer();
        const downloadMs = performance.now() - t0;
        bufferCache.set(modelId, buffer);
        return { buffer, downloadMs };
      }

      async function getSession(modelId, forceWasm) {
        const cacheKey = modelId + ':' + (forceWasm ? 'wasm' : 'auto');
        if (sessionCache.has(cacheKey)) {
          return sessionCache.get(cacheKey);
        }

        const { buffer, downloadMs } = await fetchModelBuffer(modelId);
        const bytes = new Uint8Array(buffer);

        let session = null;
        let provider = 'wasm';

        if (!forceWasm && typeof navigator !== 'undefined' && 'gpu' in navigator) {
          try {
            session = await ort.InferenceSession.create(bytes, {
              executionProviders: ['webgpu'],
            });
            provider = 'webgpu';
          } catch (_webgpuErr) {
            session = null;
          }
        }

        if (!session) {
          session = await ort.InferenceSession.create(bytes, {
            executionProviders: ['wasm'],
          });
          provider = 'wasm';
        }

        const entry = { session, provider, downloadMs };
        sessionCache.set(cacheKey, entry);
        return entry;
      }

      async function runChunkedInference(session, coords, count, runId) {
        const inputName = session.inputNames[0];
        const outputName = session.outputNames[0];
        const totalChunks = Math.ceil(count / BATCH_SIZE);

        let embeddings = null;
        let embedDim = 0;

        for (let chunkIdx = 0; chunkIdx < totalChunks; chunkIdx++) {
          if (runId !== state.runId) return null;

          const start = chunkIdx * BATCH_SIZE;
          const end = Math.min(start + BATCH_SIZE, count);
          const batchLen = end - start;
          const slice = coords.subarray(start * 2, end * 2);

          const inputTensor = new ort.Tensor('float32', slice, [batchLen, 2]);
          const results = await session.run({ [inputName]: inputTensor });
          const outTensor = results[outputName];
          const outData = outTensor.data;

          if (!embeddings) {
            embedDim = outTensor.dims[outTensor.dims.length - 1];
            embeddings = new Float32Array(count * embedDim);
          }

          embeddings.set(outData, start * embedDim);
          if (typeof outTensor.dispose === 'function') outTensor.dispose();
          if (typeof inputTensor.dispose === 'function') inputTensor.dispose();

          if (chunkIdx % 2 === 0 || chunkIdx === totalChunks - 1) {
            setStatus('Inference ' + (chunkIdx + 1) + ' / ' + totalChunks + ' chunks');
            await yieldToBrowser();
          }
        }

        return { embeddings, embedDim };
      }

      function wrapLon(lon) {
        return ((((lon + 180) % 360) + 360) % 360) - 180;
      }

      function coordToPixel(lon, lat, width, height) {
        const wLon = wrapLon(lon);
        const my = latToMercY(lat);
        const x = Math.min(
          width - 1,
          Math.max(0, Math.floor(((wLon - LON_MIN) / (LON_MAX - LON_MIN)) * width))
        );
        const y = Math.min(
          height - 1,
          Math.max(0, Math.floor(((MERC_Y_MAX - my) / (MERC_Y_MAX - MERC_Y_MIN)) * height))
        );
        return { x, y, pixelIdx: y * width + x };
      }

      function rgbaToCanvas(rgba, width, height) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.putImageData(new ImageData(rgba, width, height), 0, 0);
        return canvas;
      }

      function orthogonalizeAndNormalize(v, basis) {
        // Two-pass Modified Gram-Schmidt to maintain orthogonality through PC 9
        for (let pass = 0; pass < 2; pass++) {
          for (let b = 0; b < basis.length; b++) {
            const u = basis[b];
            let dot = 0;
            for (let d = 0; d < v.length; d++) dot += v[d] * u[d];
            for (let d = 0; d < v.length; d++) v[d] -= dot * u[d];
          }
        }
        let normSq = 0;
        for (let d = 0; d < v.length; d++) normSq += v[d] * v[d];
        const norm = Math.sqrt(normSq);
        if (norm > 1e-12) {
          for (let d = 0; d < v.length; d++) v[d] /= norm;
          return norm;
        }
        v.fill(0);
        return 0;
      }

      function extendPcaBasis(centered, sampleCount, dim, basis, targetCount) {
        const maxComp = Math.min(targetCount, dim);
        if (basis.length >= maxComp) return;

        const tmpProj = new Float64Array(sampleCount);
        const nextVec = new Float64Array(dim);
        const prevVec = new Float64Array(dim);

        for (let c = basis.length; c < maxComp; c++) {
          const v = new Float64Array(dim);
          for (let d = 0; d < dim; d++) {
            v[d] =
              Math.sin((d + 1) * (c + 1) * 1.6180339 + c * 0.73) +
              0.5 * Math.cos((d + 3) * (c + 2) * 0.6180339);
          }
          let initNorm = orthogonalizeAndNormalize(v, basis);
          if (initNorm <= 1e-12) {
            for (let k = 0; k < dim && initNorm <= 1e-12; k++) {
              v.fill(0);
              v[k] = 1;
              initNorm = orthogonalizeAndNormalize(v, basis);
            }
          }
          if (initNorm <= 1e-12) {
            basis.push(new Float32Array(dim));
            continue;
          }

          for (let iter = 0; iter < 18; iter++) {
            prevVec.set(v);
            for (let s = 0; s < sampleCount; s++) {
              const row = s * dim;
              let dot = 0;
              for (let d = 0; d < dim; d++) dot += centered[row + d] * v[d];
              tmpProj[s] = dot;
            }
            nextVec.fill(0);
            for (let s = 0; s < sampleCount; s++) {
              const p = tmpProj[s];
              const row = s * dim;
              for (let d = 0; d < dim; d++) nextVec[d] += centered[row + d] * p;
            }
            for (let d = 0; d < dim; d++) v[d] = nextVec[d];
            const norm = orthogonalizeAndNormalize(v, basis);
            if (norm <= 1e-12) break;

            let align = 0;
            for (let d = 0; d < dim; d++) align += v[d] * prevVec[d];
            if (Math.abs(align) > 1 - 1e-6) break;
          }

          // Canonicalize component sign so colors stay consistent
          let maxAbs = 0;
          let maxSign = 1;
          for (let d = 0; d < dim; d++) {
            const a = Math.abs(v[d]);
            if (a > maxAbs) {
              maxAbs = a;
              maxSign = v[d] >= 0 ? 1 : -1;
            }
          }
          const out = new Float32Array(dim);
          for (let d = 0; d < dim; d++) out[d] = v[d] * maxSign;
          basis.push(out);
        }
      }

      function ensureGlobalPca(neededComponents) {
        const embeddings = state.embeddings;
        const width = state.gridW;
        const height = state.gridH;
        const dim = state.embedDim;
        const count = width * height;

        if (!state.globalPca) {
          const maxFitSamples = 8192;
          const stride = Math.max(1, Math.floor(count / maxFitSamples));
          const sampleCount = Math.ceil(count / stride);

          const mean = new Float64Array(dim);
          for (let i = 0; i < count; i += stride) {
            const base = i * dim;
            for (let d = 0; d < dim; d++) {
              const val = embeddings[base + d];
              if (Number.isFinite(val)) mean[d] += val;
            }
          }
          for (let d = 0; d < dim; d++) mean[d] /= sampleCount;

          const centered = new Float32Array(sampleCount * dim);
          let sIdx = 0;
          for (let i = 0; i < count; i += stride) {
            const src = i * dim;
            const dst = sIdx * dim;
            for (let d = 0; d < dim; d++) {
              const val = embeddings[src + d];
              centered[dst + d] = Number.isFinite(val) ? val - mean[d] : 0;
            }
            sIdx++;
          }

          state.globalPca = {
            mean,
            centered,
            sampleCount,
            basis: [],
            scores: [],
          };
        }

        const pca = state.globalPca;
        extendPcaBasis(pca.centered, pca.sampleCount, dim, pca.basis, neededComponents);

        const prevLen = pca.scores.length;
        if (prevLen < neededComponents) {
          const newCount = neededComponents - prevLen;
          const newScores = [];
          const activeIndices = [];
          for (let j = 0; j < newCount; j++) {
            const compIdx = prevLen + j;
            const arr = new Float32Array(count);
            newScores.push(arr);
            if (compIdx < pca.basis.length) {
              activeIndices.push(j);
            }
          }

          if (activeIndices.length > 0) {
            const mean = pca.mean;
            const activeBasis = activeIndices.map((j) => pca.basis[prevLen + j]);
            const activeScores = activeIndices.map((j) => newScores[j]);
            const kLen = activeBasis.length;
            const acc = new Float64Array(kLen);

            for (let i = 0; i < count; i++) {
              const base = i * dim;
              acc.fill(0);
              for (let d = 0; d < dim; d++) {
                const raw = embeddings[base + d];
                const x = Number.isFinite(raw) ? raw - mean[d] : 0;
                for (let k = 0; k < kLen; k++) {
                  acc[k] += x * activeBasis[k][d];
                }
              }
              for (let k = 0; k < kLen; k++) {
                activeScores[k][i] = acc[k];
              }
            }
          }

          for (let j = 0; j < newCount; j++) {
            pca.scores.push(newScores[j]);
          }
        }

        return pca;
      }

      function renderRgbScoresToCanvas(s0Arr, s1Arr, s2Arr, width, height, boundsIndices) {
        const count = width * height;
        const b0 = boundsIndices
          ? percentileBoundsSubset(s0Arr, boundsIndices, 0.02, 0.98)
          : percentileBounds(s0Arr, 0.02, 0.98);
        const b1 = boundsIndices
          ? percentileBoundsSubset(s1Arr, boundsIndices, 0.02, 0.98)
          : percentileBounds(s1Arr, 0.02, 0.98);
        const b2 = boundsIndices
          ? percentileBoundsSubset(s2Arr, boundsIndices, 0.02, 0.98)
          : percentileBounds(s2Arr, 0.02, 0.98);

        const [lo0, hi0] = b0;
        const [lo1, hi1] = b1;
        const [lo2, hi2] = b2;
        const sc0 = hi0 > lo0 ? 255 / (hi0 - lo0) : 0;
        const sc1 = hi1 > lo1 ? 255 / (hi1 - lo1) : 0;
        const sc2 = hi2 > lo2 ? 255 / (hi2 - lo2) : 0;

        const rgba = new Uint8ClampedArray(count * 4);
        for (let i = 0; i < count; i++) {
          const px = i * 4;
          rgba[px] = clampByte((s0Arr[i] - lo0) * sc0);
          rgba[px + 1] = clampByte((s1Arr[i] - lo1) * sc1);
          rgba[px + 2] = clampByte((s2Arr[i] - lo2) * sc2);
          rgba[px + 3] = 255;
        }
        return rgbaToCanvas(rgba, width, height);
      }

      function renderGlobalPcaTriplet(startComp) {
        const pca = ensureGlobalPca(startComp + 3);
        const canvas = renderRgbScoresToCanvas(
          pca.scores[startComp],
          pca.scores[startComp + 1],
          pca.scores[startComp + 2],
          state.gridW,
          state.gridH,
          null
        );
        return { canvas };
      }

      function getCurrentViewportBounds() {
        if (state.deckInstance && typeof state.deckInstance.getViewports === 'function') {
          const vps = state.deckInstance.getViewports();
          if (vps && vps.length > 0 && typeof vps[0].getBounds === 'function') {
            const b = vps[0].getBounds();
            if (b && b.length === 4 && b.every(Number.isFinite)) {
              return b;
            }
          }
        }
        const container = document.getElementById('deck-container');
        const w = (container && container.clientWidth) || 800;
        const h = (container && container.clientHeight) || 500;
        const vs = state.viewState || INITIAL_VIEW_STATE;
        const scale = 512 * Math.pow(2, vs.zoom);
        const halfLon = ((w / 2) / scale) * 360;
        const clampedCenterLat = Math.max(-80, Math.min(80, vs.latitude));
        const latRad = (clampedCenterLat * Math.PI) / 180;
        const mercY = Math.log(Math.tan(Math.PI / 4 + latRad / 2));
        const halfMerc = ((h / 2) / scale) * (2 * Math.PI);
        const north = Math.min(
          LAT_MAX,
          (2 * Math.atan(Math.exp(mercY + halfMerc)) - Math.PI / 2) * (180 / Math.PI)
        );
        const south = Math.max(
          LAT_MIN,
          (2 * Math.atan(Math.exp(mercY - halfMerc)) - Math.PI / 2) * (180 / Math.PI)
        );
        return [vs.longitude - halfLon, south, vs.longitude + halfLon, north];
      }

      function getViewportPixelIndices(bounds, width, height) {
        const [west, south, east, north] = bounds;
        const sLat = Math.max(LAT_MIN, Math.min(LAT_MAX, south));
        const nLat = Math.max(LAT_MIN, Math.min(LAT_MAX, north));
        const nMercY = latToMercY(nLat);
        const sMercY = latToMercY(sLat);

        let yMin = Math.floor(((MERC_Y_MAX - nMercY) / (MERC_Y_MAX - MERC_Y_MIN)) * height);
        let yMax = Math.ceil(((MERC_Y_MAX - sMercY) / (MERC_Y_MAX - MERC_Y_MIN)) * height) - 1;
        yMin = Math.max(0, Math.min(height - 1, yMin));
        yMax = Math.max(0, Math.min(height - 1, yMax));
        if (yMin > yMax) {
          const mid = yMin;
          yMin = mid;
          yMax = mid;
        }

        const xCols = [];
        if (east - west >= 360 - 1e-6) {
          for (let x = 0; x < width; x++) xCols.push(x);
        } else {
          const wLon = wrapLon(west);
          const eLon = wrapLon(east);
          for (let x = 0; x < width; x++) {
            const lon = LON_MIN + ((x + 0.5) / width) * (LON_MAX - LON_MIN);
            const inside = wLon <= eLon ? lon >= wLon && lon <= eLon : lon >= wLon || lon <= eLon;
            if (inside) xCols.push(x);
          }
        }

        const indices = [];
        for (let y = yMin; y <= yMax; y++) {
          const rowBase = y * width;
          for (let k = 0; k < xCols.length; k++) {
            indices.push(rowBase + xCols[k]);
          }
        }

        // If deeply zoomed into a coarse grid, expand to a local neighborhood around center
        if (indices.length < 16) {
          const vs = state.viewState || INITIAL_VIEW_STATE;
          const center = coordToPixel(vs.longitude, vs.latitude, width, height);
          const rad = 3;
          const fallback = [];
          for (let dy = -rad; dy <= rad; dy++) {
            const yy = Math.max(0, Math.min(height - 1, center.y + dy));
            for (let dx = -rad; dx <= rad; dx++) {
              const xx = (center.x + dx + width) % width;
              fallback.push(yy * width + xx);
            }
          }
          return Int32Array.from(fallback);
        }

        return Int32Array.from(indices);
      }

      function renderViewportLocalPca() {
        const embeddings = state.embeddings;
        const width = state.gridW;
        const height = state.gridH;
        const dim = state.embedDim;
        const count = width * height;

        const bounds = getCurrentViewportBounds();
        const vpIndices = getViewportPixelIndices(bounds, width, height);
        const vpCount = vpIndices.length;

        const maxFitSamples = 8192;
        const stride = Math.max(1, Math.floor(vpCount / maxFitSamples));
        const sampleCount = Math.ceil(vpCount / stride);

        const mean = new Float64Array(dim);
        for (let i = 0; i < vpCount; i += stride) {
          const base = vpIndices[i] * dim;
          for (let d = 0; d < dim; d++) {
            const val = embeddings[base + d];
            if (Number.isFinite(val)) mean[d] += val;
          }
        }
        for (let d = 0; d < dim; d++) mean[d] /= sampleCount;

        const centered = new Float32Array(sampleCount * dim);
        let sIdx = 0;
        for (let i = 0; i < vpCount; i += stride) {
          const src = vpIndices[i] * dim;
          const dst = sIdx * dim;
          for (let d = 0; d < dim; d++) {
            const val = embeddings[src + d];
            centered[dst + d] = Number.isFinite(val) ? val - mean[d] : 0;
          }
          sIdx++;
        }

        const basis = [];
        extendPcaBasis(centered, sampleCount, dim, basis, 3);
        while (basis.length < 3) {
          basis.push(new Float32Array(dim));
        }

        const scores = [
          new Float32Array(count),
          new Float32Array(count),
          new Float32Array(count),
        ];
        const b0 = basis[0];
        const b1 = basis[1];
        const b2 = basis[2];

        for (let i = 0; i < count; i++) {
          const base = i * dim;
          let p0 = 0;
          let p1 = 0;
          let p2 = 0;
          for (let d = 0; d < dim; d++) {
            const raw = embeddings[base + d];
            const x = Number.isFinite(raw) ? raw - mean[d] : 0;
            p0 += x * b0[d];
            p1 += x * b1[d];
            p2 += x * b2[d];
          }
          scores[0][i] = p0;
          scores[1][i] = p1;
          scores[2][i] = p2;
        }

        const canvas = renderRgbScoresToCanvas(
          scores[0],
          scores[1],
          scores[2],
          width,
          height,
          vpIndices
        );
        return { canvas, samplePixels: vpCount };
      }

      function ensureUnitEmbeddings() {
        if (state.unitEmbeddings) return state.unitEmbeddings;
        const embeddings = state.embeddings;
        const dim = state.embedDim;
        const count = state.gridW * state.gridH;
        const unit = new Float32Array(count * dim);

        for (let i = 0; i < count; i++) {
          const base = i * dim;
          let normSq = 0;
          for (let d = 0; d < dim; d++) {
            const v = embeddings[base + d];
            if (Number.isFinite(v)) normSq += v * v;
          }
          const invNorm = normSq > 1e-24 ? 1 / Math.sqrt(normSq) : 0;
          for (let d = 0; d < dim; d++) {
            const v = embeddings[base + d];
            unit[base + d] = Number.isFinite(v) ? v * invNorm : 0;
          }
        }
        state.unitEmbeddings = unit;
        return unit;
      }

      function ensureGradientValues() {
        if (state.gradientValues) return state.gradientValues;
        const unit = ensureUnitEmbeddings();
        const width = state.gridW;
        const height = state.gridH;
        const dim = state.embedDim;
        const grad = new Float32Array(width * height);

        for (let y = 0; y < height; y++) {
          const yPrev = y > 0 ? y - 1 : 0;
          const yNext = y < height - 1 ? y + 1 : height - 1;
          const ySpan = yNext - yPrev;
          const dyScale = ySpan > 0 ? 1 / ySpan : 0;
          const rowBase = y * width;
          const rowPrev = yPrev * width;
          const rowNext = yNext * width;

          for (let x = 0; x < width; x++) {
            const xPrev = x === 0 ? width - 1 : x - 1;
            const xNext = x === width - 1 ? 0 : x + 1;

            const bL = (rowBase + xPrev) * dim;
            const bR = (rowBase + xNext) * dim;
            const bU = (rowPrev + x) * dim;
            const bD = (rowNext + x) * dim;

            let dxSq = 0;
            let dySq = 0;
            for (let d = 0; d < dim; d++) {
              const dx = unit[bR + d] - unit[bL + d];
              dxSq += dx * dx;
              const dy = unit[bD + d] - unit[bU + d];
              dySq += dy * dy;
            }
            // Interior rows have dyScale = 0.5 -> sqrt(dxSq + dySq) / 2
            grad[rowBase + x] = Math.sqrt(0.25 * dxSq + dyScale * dyScale * dySq);
          }
        }

        state.gradientValues = grad;
        return grad;
      }

      function renderScalarColormapCanvas(values, width, height, lut, lo, hi) {
        const count = width * height;
        const scale = hi > lo ? 255 / (hi - lo) : 0;
        const rgba = new Uint8ClampedArray(count * 4);
        for (let i = 0; i < count; i++) {
          const cIdx = clampByte((values[i] - lo) * scale) * 3;
          const px = i * 4;
          rgba[px] = lut[cIdx];
          rgba[px + 1] = lut[cIdx + 1];
          rgba[px + 2] = lut[cIdx + 2];
          rgba[px + 3] = 255;
        }
        return rgbaToCanvas(rgba, width, height);
      }

      function renderGradientView() {
        const grad = ensureGradientValues();
        const [lo, hi] = percentileBounds(grad, 0.02, 0.98);
        const canvas = renderScalarColormapCanvas(grad, state.gridW, state.gridH, INFERNO_LUT, lo, hi);
        return { canvas };
      }

      function renderSimilarityView() {
        const unit = ensureUnitEmbeddings();
        const width = state.gridW;
        const height = state.gridH;
        const dim = state.embedDim;
        const count = width * height;

        const seedPx = coordToPixel(state.simSeed.lon, state.simSeed.lat, width, height);
        const refBase = seedPx.pixelIdx * dim;
        const refVec = unit.subarray(refBase, refBase + dim);

        const sim = new Float32Array(count);
        let maxSim = -Infinity;
        for (let i = 0; i < count; i++) {
          const base = i * dim;
          let dot = 0;
          for (let d = 0; d < dim; d++) {
            dot += unit[base + d] * refVec[d];
          }
          sim[i] = dot;
          if (dot > maxSim) maxSim = dot;
        }

        state.similarityValues = sim;
        const [p02] = percentileBounds(sim, 0.02, 0.98);
        const hi = Math.max(maxSim, p02 + 1e-4);
        const canvas = renderScalarColormapCanvas(sim, width, height, VIRIDIS_LUT, p02, hi);
        return { canvas };
      }

      function percentileBounds(arr, pLow, pHigh) {
        const step = Math.max(1, Math.floor(arr.length / 16384));
        const sample = [];
        for (let i = 0; i < arr.length; i += step) {
          const v = arr[i];
          if (Number.isFinite(v)) sample.push(v);
        }
        if (sample.length === 0) return [0, 1];
        sample.sort((a, b) => a - b);
        const lo = sample[Math.floor((sample.length - 1) * pLow)];
        const hi = sample[Math.floor((sample.length - 1) * pHigh)];
        return hi > lo ? [lo, hi] : [sample[0], sample[sample.length - 1] + 1e-6];
      }

      function percentileBoundsSubset(arr, indices, pLow, pHigh) {
        const len = indices.length;
        if (len === 0) return [0, 1];
        const step = Math.max(1, Math.floor(len / 16384));
        const sample = [];
        for (let i = 0; i < len; i += step) {
          const v = arr[indices[i]];
          if (Number.isFinite(v)) sample.push(v);
        }
        if (sample.length === 0) return [0, 1];
        sample.sort((a, b) => a - b);
        const lo = sample[Math.floor((sample.length - 1) * pLow)];
        const hi = sample[Math.floor((sample.length - 1) * pHigh)];
        return hi > lo ? [lo, hi] : [sample[0], sample[sample.length - 1] + 1e-6];
      }

      function clampByte(v) {
        if (v <= 0) return 0;
        if (v >= 255) return 255;
        return Math.round(v);
      }

      function syncViewControls() {
        if (refitBtn) {
          refitBtn.hidden = state.currentView !== 'pca-local';
        }
        if (hoverMetricWrap && hoverMetricLabel) {
          if (state.currentView === 'gradient') {
            hoverMetricWrap.hidden = false;
            hoverMetricLabel.textContent = '‖∇e‖';
          } else if (state.currentView === 'similarity') {
            hoverMetricWrap.hidden = false;
            hoverMetricLabel.textContent = 'sim';
          } else {
            hoverMetricWrap.hidden = true;
          }
        }
      }

      function updateReadoutForCoord(lon, lat) {
        if (lon === null || lat === null) {
          hoverCoord.textContent =
            state.currentView === 'similarity'
              ? 'Click map to set ref (' +
                state.simSeed.lon.toFixed(1) +
                '°, ' +
                state.simSeed.lat.toFixed(1) +
                '°)'
              : 'Move pointer over map';
          hoverEmb.textContent = '--';
          if (hoverMetricVal) hoverMetricVal.textContent = '--';
          return;
        }

        const wLon = wrapLon(lon);
        hoverCoord.textContent = wLon.toFixed(3) + '°, ' + lat.toFixed(3) + '°';

        if (!state.embeddings || lat < LAT_MIN || lat > LAT_MAX) {
          hoverEmb.textContent = '--';
          if (hoverMetricVal) hoverMetricVal.textContent = '--';
          return;
        }

        const { pixelIdx } = coordToPixel(wLon, lat, state.gridW, state.gridH);
        if (state.currentView === 'gradient' && state.gradientValues && hoverMetricVal) {
          hoverMetricVal.textContent = state.gradientValues[pixelIdx].toFixed(4);
        } else if (state.currentView === 'similarity' && state.similarityValues && hoverMetricVal) {
          hoverMetricVal.textContent =
            state.similarityValues[pixelIdx].toFixed(4) +
            ' (ref ' +
            state.simSeed.lon.toFixed(1) +
            '°, ' +
            state.simSeed.lat.toFixed(1) +
            '°)';
        }

        const idx = pixelIdx * state.embedDim;
        const preview = [];
        const k = Math.min(3, state.embedDim);
        for (let d = 0; d < k; d++) {
          preview.push(state.embeddings[idx + d].toFixed(3));
        }
        hoverEmb.textContent = '[' + preview.join(', ') + '] (D=' + state.embedDim + ')';
      }

      function applyCurrentView() {
        syncViewControls();
        if (!state.embeddings) return;

        const t0 = performance.now();
        let canvas = null;
        let viewDesc = '';

        if (state.currentView === 'pca-1-3') {
          canvas = renderGlobalPcaTriplet(0).canvas;
          viewDesc = 'Global PC 1–3';
        } else if (state.currentView === 'pca-4-6') {
          canvas = renderGlobalPcaTriplet(3).canvas;
          viewDesc = state.embedDim < 4 ? 'PC 4–6 (D<' + 4 + ')' : 'Regional PC 4–6';
        } else if (state.currentView === 'pca-7-9') {
          canvas = renderGlobalPcaTriplet(6).canvas;
          viewDesc = state.embedDim < 7 ? 'PC 7–9 (D<' + 7 + ')' : 'Fine PC 7–9';
        } else if (state.currentView === 'pca-local') {
          const res = renderViewportLocalPca();
          canvas = res.canvas;
          viewDesc = 'Local PCA (' + res.samplePixels.toLocaleString() + ' px)';
        } else if (state.currentView === 'gradient') {
          canvas = renderGradientView().canvas;
          viewDesc = 'Gradient ‖∇e‖';
        } else if (state.currentView === 'similarity') {
          canvas = renderSimilarityView().canvas;
          viewDesc =
            'Similarity to ' +
            state.simSeed.lon.toFixed(1) +
            '°, ' +
            state.simSeed.lat.toFixed(1) +
            '°';
        }

        const viewMs = performance.now() - t0;
        state.bitmapCanvas = canvas;
        state.bitmapVersion++;
        renderDeck();

        const dlPart =
          state.lastDownloadMs > 0 ? 'dl ' + Math.round(state.lastDownloadMs) + ' ms' : 'cached';
        timingBadge.textContent =
          dlPart +
          ' · infer ' +
          Math.round(state.lastInferMs) +
          ' ms · view ' +
          Math.round(viewMs) +
          ' ms';
        setStatus('Ready (' + state.lastModelId + ', D=' + state.embedDim + ' · ' + viewDesc + ')');

        if (state.lastHoverCoord) {
          updateReadoutForCoord(state.lastHoverCoord[0], state.lastHoverCoord[1]);
        } else {
          updateReadoutForCoord(null, null);
        }
      }

      function scheduleLocalPcaRefit() {
        if (state.refitTimer !== null) {
          clearTimeout(state.refitTimer);
        }
        state.refitTimer = setTimeout(() => {
          state.refitTimer = null;
          if (state.currentView === 'pca-local' && state.embeddings) {
            applyCurrentView();
          }
        }, LOCAL_PCA_DEBOUNCE_MS);
      }

      function buildDeckLayers() {
        const layers = [];
        if (state.bitmapCanvas) {
          layers.push(
            new deck.BitmapLayer({
              id: 'pca-embeddings-' + state.bitmapVersion,
              image: state.bitmapCanvas,
              bounds: [LON_MIN, LAT_MIN, LON_MAX, LAT_MAX],
              pickable: true,
            })
          );
        }

        if (coastlinesToggle.checked && state.landGeoJson) {
          layers.push(
            new deck.GeoJsonLayer({
              id: 'world-coastlines',
              data: state.landGeoJson,
              filled: false,
              stroked: true,
              getLineColor: [230, 237, 243, 195],
              lineWidthMinPixels: 1.1,
              pickable: false,
            })
          );
        }

        if (state.currentView === 'similarity' && state.embeddings) {
          layers.push(
            new deck.ScatterplotLayer({
              id: 'similarity-seed-pin',
              data: [{ position: [state.simSeed.lon, state.simSeed.lat] }],
              getPosition: (d) => d.position,
              radiusUnits: 'pixels',
              getRadius: 7,
              stroked: true,
              filled: true,
              lineWidthUnits: 'pixels',
              getLineWidth: 2.5,
              getFillColor: [255, 255, 255, 240],
              getLineColor: [13, 17, 23, 255],
              pickable: false,
            })
          );
        }

        return layers;
      }

      function renderDeck() {
        if (!state.deckInstance) return;
        state.deckInstance.setProps({ layers: buildDeckLayers() });
      }

      function handleHover(info) {
        if (!info || !info.coordinate) {
          state.lastHoverCoord = null;
          updateReadoutForCoord(null, null);
          return;
        }
        const lon = wrapLon(info.coordinate[0]);
        const lat = info.coordinate[1];
        state.lastHoverCoord = [lon, lat];
        updateReadoutForCoord(lon, lat);
      }

      function handleClick(info) {
        if (state.currentView !== 'similarity' || !state.embeddings) return;
        if (!info || !info.coordinate) return;
        const lon = wrapLon(info.coordinate[0]);
        const lat = Math.max(LAT_MIN, Math.min(LAT_MAX, info.coordinate[1]));
        state.simSeed = { lon, lat };
        state.lastHoverCoord = [lon, lat];
        applyCurrentView();
      }

      function handleViewStateChange({ viewState }) {
        state.viewState = viewState;
        if (state.currentView === 'pca-local' && state.embeddings) {
          scheduleLocalPcaRefit();
        }
      }

      function initDeck() {
        state.deckInstance = new deck.Deck({
          parent: document.getElementById('deck-container'),
          views: new deck.MapView({ repeat: true }),
          initialViewState: INITIAL_VIEW_STATE,
          controller: true,
          layers: [],
          onHover: handleHover,
          onClick: handleClick,
          onViewStateChange: handleViewStateChange,
          getCursor: ({ isDragging }) => {
            if (isDragging) return 'grabbing';
            return state.currentView === 'similarity' ? 'crosshair' : 'grab';
          },
        });
      }

      function splitAntimeridianLines(geojson) {
        const lines = [];
        function processRing(ring) {
          if (!Array.isArray(ring) || ring.length < 2) return;
          let seg = [ring[0]];
          for (let i = 1; i < ring.length; i++) {
            const prev = ring[i - 1];
            const curr = ring[i];
            if (Math.abs(curr[0] - prev[0]) > 180) {
              if (seg.length >= 2) lines.push(seg);
              seg = [curr];
            } else {
              seg.push(curr);
            }
          }
          if (seg.length >= 2) lines.push(seg);
        }
        function walkGeom(geom) {
          if (!geom) return;
          if (geom.type === 'Polygon') {
            for (const ring of geom.coordinates) processRing(ring);
          } else if (geom.type === 'MultiPolygon') {
            for (const poly of geom.coordinates) {
              for (const ring of poly) processRing(ring);
            }
          } else if (geom.type === 'LineString') {
            processRing(geom.coordinates);
          } else if (geom.type === 'MultiLineString') {
            for (const line of geom.coordinates) processRing(line);
          } else if (geom.type === 'GeometryCollection') {
            for (const g of geom.geometries) walkGeom(g);
          }
        }
        if (geojson.type === 'FeatureCollection') {
          for (const f of geojson.features) walkGeom(f.geometry);
        } else if (geojson.type === 'Feature') {
          walkGeom(geojson.geometry);
        } else {
          walkGeom(geojson);
        }
        return {
          type: 'Feature',
          properties: {},
          geometry: { type: 'MultiLineString', coordinates: lines },
        };
      }

      async function loadCoastlines() {
        try {
          const resp = await fetch(WORLD_ATLAS_URL);
          if (!resp.ok) return;
          const topo = await resp.json();
          if (typeof topojson !== 'undefined' && topo.objects && topo.objects.land) {
            state.landGeoJson = splitAntimeridianLines(topojson.feature(topo, topo.objects.land));
            renderDeck();
          }
        } catch (_err) {
          // Coastline overlay is optional; map still renders without it.
        }
      }

      async function runPipeline() {
        const runId = ++state.runId;
        const modelId = modelSelect.value;
        const gridKm = Number(gridSelect.value);

        showError('');
        runBtn.disabled = true;

        try {
          const { width, height, count, coords } = buildCoordGrid(gridKm);
          gridBadge.textContent = 'Grid: ' + width + ' × ' + height + ' (' + count.toLocaleString() + ')';
          setStatus('Loading ' + modelId + '.onnx…');

          let sessionEntry = await getSession(modelId, false);
          if (runId !== state.runId) return;

          setBackendBadge(sessionEntry.provider);

          let tInf0 = performance.now();
          let infResult = null;
          try {
            infResult = await runChunkedInference(sessionEntry.session, coords, count, runId);
          } catch (runErr) {
            if (sessionEntry.provider === 'webgpu') {
              setStatus('WebGPU op unsupported, falling back to WASM…');
              sessionEntry = await getSession(modelId, true);
              if (runId !== state.runId) return;
              setBackendBadge(sessionEntry.provider);
              tInf0 = performance.now();
              infResult = await runChunkedInference(sessionEntry.session, coords, count, runId);
            } else {
              throw runErr;
            }
          }

          if (!infResult || runId !== state.runId) return;
          const inferMs = performance.now() - tInf0;

          setStatus('Rendering view…');
          await yieldToBrowser();
          if (runId !== state.runId) return;

          state.embeddings = infResult.embeddings;
          state.unitEmbeddings = null;
          state.globalPca = null;
          state.gradientValues = null;
          state.similarityValues = null;
          state.embedDim = infResult.embedDim;
          state.gridW = width;
          state.gridH = height;
          state.lastInferMs = inferMs;
          state.lastDownloadMs = sessionEntry.downloadMs;
          state.lastModelId = modelId;

          applyCurrentView();
        } catch (err) {
          if (runId !== state.runId) return;
          setBackendBadge('error');
          setStatus('Run failed');
          showError(err && err.message ? err.message : String(err));
        } finally {
          if (runId === state.runId) {
            runBtn.disabled = false;
          }
        }
      }

      modelSelect.addEventListener('change', runPipeline);
      gridSelect.addEventListener('change', runPipeline);
      viewSelect.addEventListener('change', () => {
        if (state.refitTimer !== null) {
          clearTimeout(state.refitTimer);
          state.refitTimer = null;
        }
        state.currentView = viewSelect.value;
        applyCurrentView();
      });
      if (refitBtn) {
        refitBtn.addEventListener('click', () => {
          if (state.refitTimer !== null) {
            clearTimeout(state.refitTimer);
            state.refitTimer = null;
          }
          if (state.currentView === 'pca-local' && state.embeddings) {
            applyCurrentView();
          }
        });
      }
      coastlinesToggle.addEventListener('change', renderDeck);
      runBtn.addEventListener('click', runPipeline);

      syncViewControls();
      initDeck();
      loadCoastlines();
      runPipeline();
    })();
  </script>
</body>
</html>
