<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live WebGPU Demo — EarthINR</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='5' y='1' width='6' height='14' fill='%231d4ed8'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%231d4ed8'/%3E%3Crect x='2' y='5' width='12' height='6' fill='%231d4ed8'/%3E%3Crect x='4' y='4' width='3' height='4' fill='%234ade80'/%3E%3Crect x='9' y='4' width='3' height='6' fill='%234ade80'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/deck.gl@9.1.4/dist.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    /* Default: Dark Digital CRT / Cartography Theme (matches docs/index.html) */
    :root {
      --bg: #0d1117;
      --surface: #131922;
      --surface-alt: #18202c;
      --surface-hover: #1d2736;
      --border: #273244;
      --border-strong: #394963;
      --shadow-color: #05080d;
      --shadow-btn: 3px 3px 0 var(--shadow-color);
      --shadow-btn-active: 1px 1px 0 var(--shadow-color);

      --text: #e6edf3;
      --text-muted: #8b9bb4;
      --text-faint: #5f708a;

      --mint: #4ade80;
      --cyan: #38bdf8;
      --amber: #facc15;
      --violet: #a78bfa;
      --danger: #f87171;

      --map-bg: #080c12;
      --readout-bg: rgba(13, 17, 23, 0.92);
      --readout-text: #e6edf3;
      --readout-border: #38bdf8;

      --btn-primary-bg: var(--mint);
      --btn-primary-fg: #08120c;
      --btn-primary-bd: #22c55e;

      --badge-webgpu-bg: rgba(74, 222, 128, 0.16);
      --badge-webgpu-bd: var(--mint);
      --badge-webgpu-fg: var(--mint);

      --badge-wasm-bg: rgba(56, 189, 248, 0.14);
      --badge-wasm-bd: var(--cyan);
      --badge-wasm-fg: var(--cyan);

      --badge-err-bg: rgba(248, 113, 113, 0.16);
      --badge-err-bd: var(--danger);
      --badge-err-fg: #fecaca;

      --font-pixel: "Silkscreen", ui-monospace, monospace;
      --font-mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Light Mode: Retro-LCD / Drafting Paper */
    :root[data-theme="light"] {
      --bg: #f2f4ef;
      --surface: #fafbf8;
      --surface-alt: #e8ece3;
      --surface-hover: #edf1e8;
      --border: #2d3a4b;
      --border-strong: #1c2430;
      --shadow-color: rgba(28, 36, 48, 0.28);
      --shadow-btn: 3px 3px 0 var(--shadow-color);
      --shadow-btn-active: 1px 1px 0 var(--shadow-color);

      --text: #1c2430;
      --text-muted: #4a596c;
      --text-faint: #6f7f93;

      --mint: #15803d;
      --cyan: #0369a1;
      --amber: #b45309;
      --violet: #6d28d9;
      --danger: #b91c1c;

      --map-bg: #121a24;
      --readout-bg: rgba(250, 251, 248, 0.94);
      --readout-text: #1c2430;
      --readout-border: #2d3a4b;

      --btn-primary-bg: #1c2430;
      --btn-primary-fg: #fafbf8;
      --btn-primary-bd: #1c2430;

      --badge-webgpu-bg: rgba(21, 128, 61, 0.14);
      --badge-webgpu-bd: #15803d;
      --badge-webgpu-fg: #14532d;

      --badge-wasm-bg: rgba(3, 105, 161, 0.12);
      --badge-wasm-bd: #0369a1;
      --badge-wasm-fg: #0c4a6e;

      --badge-err-bg: #fee2e2;
      --badge-err-bd: #b91c1c;
      --badge-err-fg: #7f1d1d;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      border-radius: 0;
    }

    html {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    @media (min-width: 721px) {
      body {
        height: 100dvh;
        overflow: hidden;
      }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Top header + nav (matches docs/index.html) */
    .topbar {
      flex-shrink: 0;
      position: relative;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 20px;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
    }

    .topbar-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
    }

    .topbar-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
    }

    .pixel-globe {
      display: block;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      image-rendering: pixelated;
    }

    .brand-wordmark {
      font-family: var(--font-pixel);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    .brand-divider {
      color: var(--text-faint);
      user-select: none;
    }

    .demo-title {
      margin: 0;
      font-family: var(--font-pixel);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--cyan);
    }

    .demo-subtitle {
      margin: 0;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .topbar-nav a {
      font-family: var(--font-pixel);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 4px 2px;
      border-bottom: 2px solid transparent;
      transition: color 0.12s ease, border-color 0.12s ease;
    }

    .topbar-nav a:hover {
      color: var(--text);
    }

    .topbar-nav a.active {
      color: var(--cyan);
      border-bottom-color: var(--cyan);
    }

    /* Controls bar (pinned above map stage so it never shrinks or gets occluded) */
    .controls-bar {
      flex-shrink: 0;
      position: relative;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 18px;
      padding: 10px 24px;
      background: var(--surface-alt);
      border-bottom: 2px solid var(--border);
    }

    .controls-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
    }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .field label {
      font-family: var(--font-pixel);
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .field select {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text);
      background: var(--surface);
      border: 2px solid var(--border-strong);
      padding: 5px 9px;
      outline: none;
      cursor: pointer;
      min-width: 0;
      max-width: 100%;
    }
    .field select:focus {
      border-color: var(--cyan);
    }

    .checkbox-field {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-field input[type="checkbox"] {
      accent-color: var(--cyan);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .px-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      background: var(--surface);
      border: 2px solid var(--border-strong);
      padding: 5px 12px;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: background 0.1s ease, border-color 0.1s ease, color 0.1s ease, transform 0.08s ease, box-shadow 0.08s ease;
      user-select: none;
    }
    .px-btn:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--cyan);
    }
    .px-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: var(--shadow-btn-active);
    }
    .px-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .px-btn-primary {
      background: var(--btn-primary-bg);
      border-color: var(--btn-primary-bd);
      color: var(--btn-primary-fg);
    }
    .px-btn-primary:hover:not(:disabled) {
      background: var(--cyan);
      border-color: var(--cyan);
      color: #06131c;
    }

    .px-btn-sm {
      padding: 4px 10px;
      font-size: 11px;
    }

    /* Telemetry / status strip */
    .telemetry {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      min-width: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
    }

    .badge-webgpu {
      font-family: var(--font-pixel);
      font-size: 10px;
      background: var(--badge-webgpu-bg);
      border-color: var(--badge-webgpu-bd);
      color: var(--badge-webgpu-fg);
    }

    .badge-wasm {
      font-family: var(--font-pixel);
      font-size: 10px;
      background: var(--badge-wasm-bg);
      border-color: var(--badge-wasm-bd);
      color: var(--badge-wasm-fg);
    }

    .badge-error {
      font-family: var(--font-pixel);
      font-size: 10px;
      background: var(--badge-err-bg);
      border-color: var(--badge-err-bd);
      color: var(--badge-err-fg);
    }

    .status-line {
      color: var(--text-muted);
      font-size: 11.5px;
    }

    /* Map container (isolated stacking context below topbar/controls) */
    .map-stage {
      position: relative;
      z-index: 1;
      isolation: isolate;
      flex: 1 1 auto;
      min-height: 420px;
      width: 100%;
      background: var(--map-bg);
      overflow: hidden;
    }

    #deck-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hover-readout {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      padding: 7px 12px;
      border: 2px solid var(--readout-border);
      background: var(--readout-bg);
      color: var(--readout-text);
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45);
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      max-width: calc(100% - 32px);
    }

    .hover-readout .label {
      font-family: var(--font-pixel);
      font-size: 9.5px;
      color: var(--cyan);
      margin-right: 6px;
    }

    .hover-readout .sep {
      color: var(--text-faint);
      margin: 0 8px;
    }

    .error-overlay {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      max-width: 560px;
      width: calc(100% - 32px);
      padding: 11px 14px;
      border: 2px solid var(--danger);
      background: var(--surface);
      color: var(--text);
      box-shadow: 3px 3px 0 var(--shadow-color);
      font-size: 12.5px;
      display: none;
    }
    .error-overlay.show { display: block; }
    .error-overlay strong { color: var(--danger); }

    @media (max-width: 720px) {
      .topbar {
        padding: 10px 12px;
        gap: 8px 12px;
      }
      .demo-subtitle,
      .brand-divider,
      .demo-title {
        display: none;
      }
      .topbar-right {
        gap: 10px;
      }
      .topbar-nav {
        gap: 12px;
      }
      .controls-bar {
        padding: 10px 12px;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .controls-group {
        width: 100%;
        gap: 8px 10px;
      }
      .field {
        flex: 1 1 auto;
      }
      .field select {
        flex: 1 1 auto;
        width: 100%;
      }
      .telemetry {
        width: 100%;
        gap: 6px;
        overflow-wrap: anywhere;
      }
      .map-stage {
        flex: 1 0 380px;
        min-height: 380px;
      }
      .hover-readout {
        left: 10px;
        bottom: 10px;
        max-width: calc(100% - 20px);
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="topbar-brand" href="index.html">
        <svg class="pixel-globe" viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true">
          <!-- Pixel-art Earth globe (16x16) -->
          <rect x="5" y="1" width="6" height="1" fill="#38bdf8"/>
          <rect x="3" y="2" width="2" height="1" fill="#38bdf8"/>
          <rect x="11" y="2" width="2" height="1" fill="#38bdf8"/>
          <rect x="2" y="3" width="1" height="2" fill="#38bdf8"/>
          <rect x="13" y="3" width="1" height="2" fill="#38bdf8"/>
          <rect x="1" y="5" width="1" height="6" fill="#38bdf8"/>
          <rect x="14" y="5" width="1" height="6" fill="#38bdf8"/>
          <rect x="2" y="11" width="1" height="2" fill="#38bdf8"/>
          <rect x="13" y="11" width="1" height="2" fill="#38bdf8"/>
          <rect x="3" y="13" width="2" height="1" fill="#38bdf8"/>
          <rect x="11" y="13" width="2" height="1" fill="#38bdf8"/>
          <rect x="5" y="14" width="6" height="1" fill="#38bdf8"/>
          <!-- Ocean fill -->
          <rect x="5" y="2" width="6" height="12" fill="#1d4ed8"/>
          <rect x="3" y="3" width="10" height="10" fill="#1d4ed8"/>
          <rect x="2" y="5" width="12" height="6" fill="#1d4ed8"/>
          <!-- Subtle highlight -->
          <rect x="4" y="3" width="2" height="1" fill="#60a5fa"/>
          <rect x="3" y="4" width="1" height="2" fill="#60a5fa"/>
          <!-- Polar caps -->
          <rect x="6" y="2" width="4" height="1" fill="#e6edf3"/>
          <rect x="6" y="13" width="4" height="1" fill="#e6edf3"/>
          <!-- Americas (left) -->
          <rect x="4" y="4" width="3" height="2" fill="#4ade80"/>
          <rect x="3" y="6" width="3" height="2" fill="#4ade80"/>
          <rect x="5" y="8" width="2" height="2" fill="#22c55e"/>
          <rect x="5" y="10" width="2" height="2" fill="#22c55e"/>
          <!-- Europe / Africa (right) -->
          <rect x="9" y="4" width="3" height="2" fill="#4ade80"/>
          <rect x="8" y="6" width="4" height="2" fill="#4ade80"/>
          <rect x="9" y="8" width="3" height="3" fill="#22c55e"/>
          <rect x="10" y="11" width="2" height="1" fill="#22c55e"/>
        </svg>
        <span class="brand-wordmark">EARTHINR</span>
      </a>
      <span class="brand-divider">/</span>
      <h1 class="demo-title">LIVE EMBEDDING MAP</h1>
      <p class="demo-subtitle">In-browser ONNX inference projected onto its first three principal components (RGB).</p>
    </div>
    <div class="topbar-right">
      <nav class="topbar-nav" aria-label="Primary">
        <a href="index.html">Leaderboard</a>
        <a href="demo.html" class="active" aria-current="page">WebGPU Demo</a>
      </nav>
      <button id="theme-toggle" class="px-btn px-btn-sm" type="button" title="Toggle dark CRT / light LCD mode">
        LCD Light
      </button>
    </div>
  </header>

  <section class="controls-bar" aria-label="Model and grid controls">
    <div class="controls-group">
      <div class="field">
        <label for="model-select">Model</label>
        <select id="model-select">
          <option value="csp-inat">csp-inat (0.8 MB)</option>
          <option value="csp-fmow">csp-fmow (0.8 MB)</option>
          <option value="sinr" selected>sinr (2.1 MB)</option>
          <option value="satclip-vit16-l10">satclip-vit16-l10 (2.1 MB)</option>
          <option value="osmgraphclip-a-l10">osmgraphclip-a-l10 (2.1 MB)</option>
          <option value="le-sinr">le-sinr (2.4 MB)</option>
          <option value="geoclosp-rn">geoclosp-rn (2.6 MB)</option>
          <option value="hydroloc">hydroloc (4.3 MB)</option>
          <option value="satclip-vit16-l40">satclip-vit16-l40 (6.3 MB)</option>
          <option value="tte">tte (13.2 MB)</option>
          <option value="climplicit">climplicit (16.2 MB)</option>
        </select>
      </div>

      <div class="field">
        <label for="grid-select">Grid</label>
        <select id="grid-select">
          <option value="250">250 km</option>
          <option value="100" selected>100 km</option>
          <option value="50">50 km</option>
          <option value="25">25 km</option>
        </select>
      </div>

      <label class="checkbox-field">
        <input id="coastlines-toggle" type="checkbox" checked />
        Coastlines
      </label>

      <button id="run-btn" class="px-btn px-btn-primary" type="button">Run</button>
    </div>

    <div class="telemetry">
      <span id="backend-badge" class="badge">Backend: --</span>
      <span id="grid-badge" class="badge">Grid: --</span>
      <span id="timing-badge" class="badge">Timing: --</span>
      <span id="status-line" class="status-line">Initializing&hellip;</span>
    </div>
  </section>

  <main class="map-stage">
    <div id="deck-container"></div>
    <div id="error-overlay" class="error-overlay" role="alert"></div>
    <div id="hover-readout" class="hover-readout">
      <span class="label">COORD</span><span id="hover-coord">Move pointer over map</span>
      <span class="sep">|</span>
      <span class="label">e[0..2]</span><span id="hover-emb">--</span>
    </div>
  </main>

  <script>
    (() => {
      'use strict';

      // Shared theme toggle (default: dark CRT; persisted under coordbench-theme)
      const themeToggle = document.getElementById('theme-toggle');
      function syncThemeButton() {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        if (themeToggle) themeToggle.textContent = isLight ? 'CRT Dark' : 'LCD Light';
      }
      function initTheme() {
        const saved = localStorage.getItem('coordbench-theme');
        document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
        syncThemeButton();
      }
      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          const isLight = document.documentElement.getAttribute('data-theme') === 'light';
          const next = isLight ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('coordbench-theme', next);
          syncThemeButton();
        });
      }
      initTheme();

      const HF_BASE = 'https://huggingface.co/taylor-geospatial/earthinr-zoo/resolve/main';
      const ORT_WASM_CDN = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
      const WORLD_ATLAS_URL = 'https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json';

      const LON_MIN = -180;
      const LON_MAX = 180;
      const LAT_MIN = -85;
      const LAT_MAX = 85;
      const KM_PER_DEG = 111.32;
      const BATCH_SIZE = 4096;

      if (typeof ort !== 'undefined' && ort.env && ort.env.wasm) {
        ort.env.wasm.wasmPaths = ORT_WASM_CDN;
      }

      const modelSelect = document.getElementById('model-select');
      const gridSelect = document.getElementById('grid-select');
      const coastlinesToggle = document.getElementById('coastlines-toggle');
      const runBtn = document.getElementById('run-btn');
      const backendBadge = document.getElementById('backend-badge');
      const gridBadge = document.getElementById('grid-badge');
      const timingBadge = document.getElementById('timing-badge');
      const statusLine = document.getElementById('status-line');
      const errorOverlay = document.getElementById('error-overlay');
      const hoverCoord = document.getElementById('hover-coord');
      const hoverEmb = document.getElementById('hover-emb');

      const bufferCache = new Map();
      const sessionCache = new Map();

      const state = {
        runId: 0,
        landGeoJson: null,
        bitmapCanvas: null,
        bitmapVersion: 0,
        embeddings: null,
        embedDim: 0,
        gridW: 0,
        gridH: 0,
        deckInstance: null,
      };

      function setStatus(text) {
        statusLine.textContent = text;
      }

      function showError(message) {
        if (!message) {
          errorOverlay.classList.remove('show');
          errorOverlay.innerHTML = '';
          return;
        }
        errorOverlay.innerHTML = '<strong>Error:</strong> ' + escapeHtml(message);
        errorOverlay.classList.add('show');
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function setBackendBadge(provider) {
        backendBadge.className = 'badge';
        if (provider === 'webgpu') {
          backendBadge.textContent = 'WEBGPU';
          backendBadge.classList.add('badge-webgpu');
        } else if (provider === 'wasm') {
          backendBadge.textContent = 'WASM';
          backendBadge.classList.add('badge-wasm');
        } else if (provider === 'error') {
          backendBadge.textContent = 'FAILED';
          backendBadge.classList.add('badge-error');
        } else {
          backendBadge.textContent = 'Backend: --';
        }
      }

      function yieldToBrowser() {
        return new Promise((resolve) => setTimeout(resolve, 0));
      }

      function buildCoordGrid(km) {
        const stepDeg = km / KM_PER_DEG;
        const width = Math.max(2, Math.round((LON_MAX - LON_MIN) / stepDeg));
        const height = Math.max(2, Math.round((LAT_MAX - LAT_MIN) / stepDeg));
        const count = width * height;
        const coords = new Float32Array(count * 2);

        let ptr = 0;
        for (let y = 0; y < height; y++) {
          const lat = LAT_MAX - ((y + 0.5) / height) * (LAT_MAX - LAT_MIN);
          for (let x = 0; x < width; x++) {
            const lon = LON_MIN + ((x + 0.5) / width) * (LON_MAX - LON_MIN);
            coords[ptr++] = lon;
            coords[ptr++] = lat;
          }
        }
        return { width, height, count, coords };
      }

      async function fetchModelBuffer(modelId) {
        if (bufferCache.has(modelId)) {
          return { buffer: bufferCache.get(modelId), downloadMs: 0 };
        }
        const url = HF_BASE + '/' + encodeURIComponent(modelId) + '/model.onnx';
        const t0 = performance.now();
        const resp = await fetch(url);
        if (!resp.ok) {
          throw new Error('HTTP ' + resp.status + ' fetching ' + modelId + '/model.onnx');
        }
        const buffer = await resp.arrayBuffer();
        const downloadMs = performance.now() - t0;
        bufferCache.set(modelId, buffer);
        return { buffer, downloadMs };
      }

      async function getSession(modelId, forceWasm) {
        const cacheKey = modelId + ':' + (forceWasm ? 'wasm' : 'auto');
        if (sessionCache.has(cacheKey)) {
          return sessionCache.get(cacheKey);
        }

        const { buffer, downloadMs } = await fetchModelBuffer(modelId);
        const bytes = new Uint8Array(buffer);

        let session = null;
        let provider = 'wasm';

        if (!forceWasm && typeof navigator !== 'undefined' && 'gpu' in navigator) {
          try {
            session = await ort.InferenceSession.create(bytes, {
              executionProviders: ['webgpu'],
            });
            provider = 'webgpu';
          } catch (_webgpuErr) {
            session = null;
          }
        }

        if (!session) {
          session = await ort.InferenceSession.create(bytes, {
            executionProviders: ['wasm'],
          });
          provider = 'wasm';
        }

        const entry = { session, provider, downloadMs };
        sessionCache.set(cacheKey, entry);
        return entry;
      }

      async function runChunkedInference(session, coords, count, runId) {
        const inputName = session.inputNames[0];
        const outputName = session.outputNames[0];
        const totalChunks = Math.ceil(count / BATCH_SIZE);

        let embeddings = null;
        let embedDim = 0;

        for (let chunkIdx = 0; chunkIdx < totalChunks; chunkIdx++) {
          if (runId !== state.runId) return null;

          const start = chunkIdx * BATCH_SIZE;
          const end = Math.min(start + BATCH_SIZE, count);
          const batchLen = end - start;
          const slice = coords.subarray(start * 2, end * 2);

          const inputTensor = new ort.Tensor('float32', slice, [batchLen, 2]);
          const results = await session.run({ [inputName]: inputTensor });
          const outTensor = results[outputName];
          const outData = outTensor.data;

          if (!embeddings) {
            embedDim = outTensor.dims[outTensor.dims.length - 1];
            embeddings = new Float32Array(count * embedDim);
          }

          embeddings.set(outData, start * embedDim);
          if (typeof outTensor.dispose === 'function') outTensor.dispose();
          if (typeof inputTensor.dispose === 'function') inputTensor.dispose();

          if (chunkIdx % 2 === 0 || chunkIdx === totalChunks - 1) {
            setStatus('Inference ' + (chunkIdx + 1) + ' / ' + totalChunks + ' chunks');
            await yieldToBrowser();
          }
        }

        return { embeddings, embedDim };
      }

      function computePcaRgbCanvas(embeddings, width, height, dim) {
        const count = width * height;
        const maxFitSamples = 8192;
        const stride = Math.max(1, Math.floor(count / maxFitSamples));
        const sampleCount = Math.ceil(count / stride);

        // Compute feature means on strided sample
        const mean = new Float64Array(dim);
        for (let i = 0; i < count; i += stride) {
          const base = i * dim;
          for (let d = 0; d < dim; d++) {
            const val = embeddings[base + d];
            if (Number.isFinite(val)) mean[d] += val;
          }
        }
        for (let d = 0; d < dim; d++) mean[d] /= sampleCount;

        // Materialize centered sample matrix for fast power iteration
        const centered = new Float32Array(sampleCount * dim);
        let sIdx = 0;
        for (let i = 0; i < count; i += stride) {
          const src = i * dim;
          const dst = sIdx * dim;
          for (let d = 0; d < dim; d++) {
            const val = embeddings[src + d];
            centered[dst + d] = Number.isFinite(val) ? val - mean[d] : 0;
          }
          sIdx++;
        }

        // Power iteration for top 3 principal components
        const basis = [];
        const tmpProj = new Float64Array(sampleCount);
        const nextVec = new Float64Array(dim);
        const nComp = Math.min(3, dim);

        for (let c = 0; c < nComp; c++) {
          const v = new Float64Array(dim);
          for (let d = 0; d < dim; d++) {
            v[d] = Math.sin((d + 1) * (c + 1) * 1.6180339) + 0.5;
          }
          orthogonalizeAndNormalize(v, basis);

          for (let iter = 0; iter < 14; iter++) {
            for (let s = 0; s < sampleCount; s++) {
              const row = s * dim;
              let dot = 0;
              for (let d = 0; d < dim; d++) dot += centered[row + d] * v[d];
              tmpProj[s] = dot;
            }
            nextVec.fill(0);
            for (let s = 0; s < sampleCount; s++) {
              const p = tmpProj[s];
              const row = s * dim;
              for (let d = 0; d < dim; d++) nextVec[d] += centered[row + d] * p;
            }
            for (let d = 0; d < dim; d++) v[d] = nextVec[d];
            orthogonalizeAndNormalize(v, basis);
          }

          basis.push(Float32Array.from(v));
        }

        while (basis.length < 3) {
          basis.push(new Float32Array(dim));
        }

        // Project all N points onto top 3 components
        const scores = [
          new Float32Array(count),
          new Float32Array(count),
          new Float32Array(count),
        ];
        const b0 = basis[0];
        const b1 = basis[1];
        const b2 = basis[2];

        for (let i = 0; i < count; i++) {
          const base = i * dim;
          let p0 = 0;
          let p1 = 0;
          let p2 = 0;
          for (let d = 0; d < dim; d++) {
            const raw = embeddings[base + d];
            const x = Number.isFinite(raw) ? raw - mean[d] : 0;
            p0 += x * b0[d];
            p1 += x * b1[d];
            p2 += x * b2[d];
          }
          scores[0][i] = p0;
          scores[1][i] = p1;
          scores[2][i] = p2;
        }

        // 2-98 percentile stretch per channel
        const bounds = scores.map((arr) => percentileBounds(arr, 0.02, 0.98));

        const rgba = new Uint8ClampedArray(count * 4);
        const [lo0, hi0] = bounds[0];
        const [lo1, hi1] = bounds[1];
        const [lo2, hi2] = bounds[2];
        const s0 = hi0 > lo0 ? 255 / (hi0 - lo0) : 0;
        const s1 = hi1 > lo1 ? 255 / (hi1 - lo1) : 0;
        const s2 = hi2 > lo2 ? 255 / (hi2 - lo2) : 0;

        for (let i = 0; i < count; i++) {
          const px = i * 4;
          rgba[px] = clampByte((scores[0][i] - lo0) * s0);
          rgba[px + 1] = clampByte((scores[1][i] - lo1) * s1);
          rgba[px + 2] = clampByte((scores[2][i] - lo2) * s2);
          rgba[px + 3] = 255;
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.putImageData(new ImageData(rgba, width, height), 0, 0);
        return canvas;
      }

      function orthogonalizeAndNormalize(v, basis) {
        for (let b = 0; b < basis.length; b++) {
          const u = basis[b];
          let dot = 0;
          for (let d = 0; d < v.length; d++) dot += v[d] * u[d];
          for (let d = 0; d < v.length; d++) v[d] -= dot * u[d];
        }
        let normSq = 0;
        for (let d = 0; d < v.length; d++) normSq += v[d] * v[d];
        const norm = Math.sqrt(normSq);
        if (norm > 1e-12) {
          for (let d = 0; d < v.length; d++) v[d] /= norm;
        }
      }

      function percentileBounds(arr, pLow, pHigh) {
        const step = Math.max(1, Math.floor(arr.length / 16384));
        const sample = [];
        for (let i = 0; i < arr.length; i += step) {
          const v = arr[i];
          if (Number.isFinite(v)) sample.push(v);
        }
        if (sample.length === 0) return [0, 1];
        sample.sort((a, b) => a - b);
        const lo = sample[Math.floor((sample.length - 1) * pLow)];
        const hi = sample[Math.floor((sample.length - 1) * pHigh)];
        return hi > lo ? [lo, hi] : [sample[0], sample[sample.length - 1] + 1e-6];
      }

      function clampByte(v) {
        if (v <= 0) return 0;
        if (v >= 255) return 255;
        return Math.round(v);
      }

      function buildDeckLayers() {
        const layers = [];
        if (state.bitmapCanvas) {
          layers.push(
            new deck.BitmapLayer({
              id: 'pca-embeddings-' + state.bitmapVersion,
              image: state.bitmapCanvas,
              bounds: [LON_MIN, LAT_MIN, LON_MAX, LAT_MAX],
              pickable: true,
            })
          );
        }

        if (coastlinesToggle.checked && state.landGeoJson) {
          layers.push(
            new deck.GeoJsonLayer({
              id: 'world-coastlines',
              data: state.landGeoJson,
              filled: false,
              stroked: true,
              getLineColor: [230, 237, 243, 195],
              lineWidthMinPixels: 1.1,
              pickable: false,
            })
          );
        }

        return layers;
      }

      function renderDeck() {
        if (!state.deckInstance) return;
        state.deckInstance.setProps({ layers: buildDeckLayers() });
      }

      function handleHover(info) {
        if (!info || !info.coordinate) {
          hoverCoord.textContent = 'Move pointer over map';
          hoverEmb.textContent = '--';
          return;
        }
        let lon = info.coordinate[0];
        const lat = info.coordinate[1];
        // Wrap longitude into [-180, 180]
        lon = ((((lon + 180) % 360) + 360) % 360) - 180;

        hoverCoord.textContent = lon.toFixed(3) + '°, ' + lat.toFixed(3) + '°';

        if (!state.embeddings || lat < LAT_MIN || lat > LAT_MAX) {
          hoverEmb.textContent = '--';
          return;
        }

        const x = Math.min(
          state.gridW - 1,
          Math.max(0, Math.floor(((lon - LON_MIN) / (LON_MAX - LON_MIN)) * state.gridW))
        );
        const y = Math.min(
          state.gridH - 1,
          Math.max(0, Math.floor(((LAT_MAX - lat) / (LAT_MAX - LAT_MIN)) * state.gridH))
        );
        const idx = (y * state.gridW + x) * state.embedDim;
        const preview = [];
        const k = Math.min(3, state.embedDim);
        for (let d = 0; d < k; d++) {
          preview.push(state.embeddings[idx + d].toFixed(3));
        }
        hoverEmb.textContent = '[' + preview.join(', ') + '] (D=' + state.embedDim + ')';
      }

      function initDeck() {
        state.deckInstance = new deck.Deck({
          parent: document.getElementById('deck-container'),
          views: new deck.MapView({ repeat: true }),
          initialViewState: {
            longitude: 0,
            latitude: 15,
            zoom: 1.35,
            minZoom: 0.5,
            maxZoom: 10,
            pitch: 0,
            bearing: 0,
          },
          controller: true,
          layers: [],
          onHover: handleHover,
        });
      }

      function splitAntimeridianLines(geojson) {
        const lines = [];
        function processRing(ring) {
          if (!Array.isArray(ring) || ring.length < 2) return;
          let seg = [ring[0]];
          for (let i = 1; i < ring.length; i++) {
            const prev = ring[i - 1];
            const curr = ring[i];
            if (Math.abs(curr[0] - prev[0]) > 180) {
              if (seg.length >= 2) lines.push(seg);
              seg = [curr];
            } else {
              seg.push(curr);
            }
          }
          if (seg.length >= 2) lines.push(seg);
        }
        function walkGeom(geom) {
          if (!geom) return;
          if (geom.type === 'Polygon') {
            for (const ring of geom.coordinates) processRing(ring);
          } else if (geom.type === 'MultiPolygon') {
            for (const poly of geom.coordinates) {
              for (const ring of poly) processRing(ring);
            }
          } else if (geom.type === 'LineString') {
            processRing(geom.coordinates);
          } else if (geom.type === 'MultiLineString') {
            for (const line of geom.coordinates) processRing(line);
          } else if (geom.type === 'GeometryCollection') {
            for (const g of geom.geometries) walkGeom(g);
          }
        }
        if (geojson.type === 'FeatureCollection') {
          for (const f of geojson.features) walkGeom(f.geometry);
        } else if (geojson.type === 'Feature') {
          walkGeom(geojson.geometry);
        } else {
          walkGeom(geojson);
        }
        return {
          type: 'Feature',
          properties: {},
          geometry: { type: 'MultiLineString', coordinates: lines },
        };
      }

      async function loadCoastlines() {
        try {
          const resp = await fetch(WORLD_ATLAS_URL);
          if (!resp.ok) return;
          const topo = await resp.json();
          if (typeof topojson !== 'undefined' && topo.objects && topo.objects.land) {
            state.landGeoJson = splitAntimeridianLines(topojson.feature(topo, topo.objects.land));
            renderDeck();
          }
        } catch (_err) {
          // Coastline overlay is optional; map still renders without it.
        }
      }

      async function runPipeline() {
        const runId = ++state.runId;
        const modelId = modelSelect.value;
        const gridKm = Number(gridSelect.value);

        showError('');
        runBtn.disabled = true;

        try {
          const { width, height, count, coords } = buildCoordGrid(gridKm);
          gridBadge.textContent = 'Grid: ' + width + ' × ' + height + ' (' + count.toLocaleString() + ')';
          setStatus('Loading ' + modelId + '.onnx…');

          let sessionEntry = await getSession(modelId, false);
          if (runId !== state.runId) return;

          setBackendBadge(sessionEntry.provider);

          let tInf0 = performance.now();
          let infResult = null;
          try {
            infResult = await runChunkedInference(sessionEntry.session, coords, count, runId);
          } catch (runErr) {
            if (sessionEntry.provider === 'webgpu') {
              setStatus('WebGPU op unsupported, falling back to WASM…');
              sessionEntry = await getSession(modelId, true);
              if (runId !== state.runId) return;
              setBackendBadge(sessionEntry.provider);
              tInf0 = performance.now();
              infResult = await runChunkedInference(sessionEntry.session, coords, count, runId);
            } else {
              throw runErr;
            }
          }

          if (!infResult || runId !== state.runId) return;
          const inferMs = performance.now() - tInf0;

          setStatus('Computing 3-component PCA…');
          await yieldToBrowser();
          if (runId !== state.runId) return;

          const tPca0 = performance.now();
          const canvas = computePcaRgbCanvas(infResult.embeddings, width, height, infResult.embedDim);
          const pcaMs = performance.now() - tPca0;

          state.embeddings = infResult.embeddings;
          state.embedDim = infResult.embedDim;
          state.gridW = width;
          state.gridH = height;
          state.bitmapCanvas = canvas;
          state.bitmapVersion++;
          renderDeck();

          const dlPart = sessionEntry.downloadMs > 0
            ? 'dl ' + Math.round(sessionEntry.downloadMs) + ' ms'
            : 'cached';
          timingBadge.textContent =
            dlPart + ' · infer ' + Math.round(inferMs) + ' ms · pca ' + Math.round(pcaMs) + ' ms';
          setStatus('Ready (' + modelId + ', D=' + infResult.embedDim + ')');
        } catch (err) {
          if (runId !== state.runId) return;
          setBackendBadge('error');
          setStatus('Run failed');
          showError(err && err.message ? err.message : String(err));
        } finally {
          if (runId === state.runId) {
            runBtn.disabled = false;
          }
        }
      }

      modelSelect.addEventListener('change', runPipeline);
      gridSelect.addEventListener('change', runPipeline);
      coastlinesToggle.addEventListener('change', renderDeck);
      runBtn.addEventListener('click', runPipeline);

      initDeck();
      loadCoastlines();
      runPipeline();
    })();
  </script>
</body>
</html>
